<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestream Like Avatar Bouncer</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #090d16;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* Thanh điều hướng dán Link */
        .control-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(18, 26, 43, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 20px;
            border-radius: 50px;
            display: flex;
            gap: 10px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 650px;
        }

        .input-url {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 10px 18px;
            border-radius: 30px;
            outline: none;
            font-size: 14px;
        }

        .input-url:focus {
            border-color: #00ffcc;
        }

        .btn-connect {
            background: linear-gradient(135deg, #00ffcc, #00b386);
            color: #000;
            font-weight: 800;
            border: none;
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-connect:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
        }

        /* Canvas hiển thị bóng nảy */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .info-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #94a3b8;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Thanh dán link Live Stream -->
    <div class="control-bar">
        <input type="text" id="streamUrl" class="input-url" placeholder="Dán link Live Stream (TikTok, FB, YouTube) vào đây...">
        <button class="btn-connect" onclick="loadLiveStreamLikes()">🚀 LẤY LIKE LIVE</button>
    </div>

    <div class="info-badge" id="statusText">Số bóng Avatar đang nảy: 0</div>

    <!-- Khung vẽ Canvas physics -->
    <canvas id="bounceCanvas"></canvas>

<script>
    const canvas = document.getElementById("bounceCanvas");
    const ctx = canvas.getContext("2d");
    let balls = [];
    let animationFrameId;

    // Tự động fit kích thước Canvas theo màn hình
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // --- LỚP VẬT LÝ QUẢ BÓNG AVATAR ---
    class AvatarBall {
        constructor(x, y, avatarUrl, name) {
            this.x = x;
            this.y = y;
            this.radius = 35; // Bán kính quả bóng
            // Vận tốc nẫu nhiên (Tốc độ nảy)
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.name = name;

            // Load ảnh Avatar
            this.img = new Image();
            this.img.src = avatarUrl;
        }

        update() {
            // Cập nhật vị trí
            this.x += this.vx;
            this.y += this.vy;

            // Nảy khi va vào cạnh TRÁI / PHẢI
            if (this.x - this.radius < 0) {
                this.x = this.radius;
                this.vx *= -1;
            } else if (this.x + this.radius > canvas.width) {
                this.x = canvas.width - this.radius;
                this.vx *= -1;
            }

            // Nảy khi va vào cạnh TRÊN / DƯỚI
            if (this.y - this.radius < 0) {
                this.y = this.radius;
                this.vy *= -1;
            } else if (this.y + this.radius > canvas.height) {
                this.y = canvas.height - this.radius;
                this.vy *= -1;
            }
        }

        draw() {
            // 1. Vẽ Quả bóng chứa Avatar tròn
            ctx.save();
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            if (this.img.complete && this.img.naturalWidth !== 0) {
                ctx.drawImage(this.img, this.x - this.radius, this.y - this.radius, this.radius * 2, this.radius * 2);
            } else {
                ctx.fillStyle = "#6366f1";
                ctx.fill();
            }
            ctx.restore();

            // 2. Vẽ viền Neon phát sáng quanh bóng
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#00ffcc";
            ctx.stroke();

            // 3. Vẽ tên người Like dưới quả bóng
            ctx.font = "bold 12px 'Plus Jakarta Sans', sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.shadowColor = "black";
            ctx.shadowBlur = 4;
            ctx.fillText(this.name, this.x, this.y + this.radius + 16);
            ctx.shadowBlur = 0; // Reset shadow
        }
    }

    // --- VÒNG LẶP ANIMATION (60 FPS) ---
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        balls.forEach(ball => {
            ball.update();
            ball.draw();
        });

        animationFrameId = requestAnimationFrame(animate);
    }

    // --- XỬ LÝ KHIN ĐỔI LINK LIVE STREAM MỚI ---
    function loadLiveStreamLikes() {
        const url = document.getElementById("streamUrl").value.trim();
        if (!url) {
            alert("Vui lòng dán link Live Stream vào!");
            return;
        }

        // 1. XÓA SẠCH DÀN BÓNG CŨ
        balls = [];

        // 2. MÔ PHỎNG NẠP DÀN AVATAR MỚI TỪ LINK VỪA NHẬP
        // (Trong thực tế, đoạn này sẽ gọi API lấy danh sách user thả Like của Stream đó)
        
        // Danh sách Avatar ngẫu nhiên test giao diện
        const sampleUsers = [
            { name: "Minh Tuấn", avatar: "https://i.pravatar.cc/150?img=11" },
            { name: "Linh Gamer", avatar: "https://i.pravatar.cc/150?img=5" },
            { name: "Hoàng Pro", avatar: "https://i.pravatar.cc/150?img=3" },
            { name: "Thảo Nhi", avatar: "https://i.pravatar.cc/150?img=9" },
            { name: "Đạt 0ms", avatar: "https://i.pravatar.cc/150?img=60" },
            { name: "Hùng Master", avatar: "https://i.pravatar.cc/150?img=68" },
            { name: "Trâm Anh", avatar: "https://i.pravatar.cc/150?img=47" },
            { name: "Văn Nam", avatar: "https://i.pravatar.cc/150?img=12" }
        ];

        // Tạo bóng rơi từ vị trí ngẫu nhiên
        sampleUsers.forEach(user => {
            let startX = Math.random() * (canvas.width - 100) + 50;
            let startY = Math.random() * (canvas.height - 100) + 50;
            balls.push(new AvatarBall(startX, startY, user.avatar, user.name));
        });

        document.getElementById("statusText").innerText = `Số bóng Avatar đang nảy: ${balls.length}`;
    }

    // Chạy Animation ngay khi mở web
    animate();
</script>

</body>
</html>
